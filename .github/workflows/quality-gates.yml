name: Quality Gates

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body:
    name: PR body contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check required PR sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          failed=false
          for section in "变更说明" "关联" "影响范围" "测试结果"; do
            if printf '%s' "$PR_BODY" | grep -q "## $section"; then
              echo "OK: ## $section"
            else
              echo "Missing: ## $section"
              failed=true
            fi
          done
          test "$failed" = false

  repository-quality:
    name: Roadmap, syntax and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumino
          POSTGRES_PASSWORD: lumino
          POSTGRES_DB: lumino_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumino -d lumino_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://lumino:lumino@localhost:5432/lumino_platform
      LEADS_STORE: postgres
      STAFF_USERS: ops@lumino.tech:OpsTest-123456:ops:Ops,sales@lumino.tech:SalesTest-123456:sales:Sales
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Validate Roadmap manifest
        run: node scripts/github-roadmap-sync.mjs --check

      - name: Check JavaScript syntax
        run: |
          search_paths=()
          for directory in api apps calculator packages portal scripts services site tests; do
            if [ -d "$directory" ]; then
              search_paths+=("$directory")
            fi
          done
          find "${search_paths[@]}" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check

      - name: Apply database migrations
        run: node scripts/db/migrate.mjs

      - name: Run deterministic tests
        run: |
          shopt -s nullglob
          test_files=(tests/*.test.* packages/agent/tests/*.test.* packages/advisor/tests/*.test.* packages/platform/tests/*.test.*)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No deterministic tests found"
            exit 1
          fi
          node --test "${test_files[@]}"

      - name: Check whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --format=fuller HEAD
          fi
