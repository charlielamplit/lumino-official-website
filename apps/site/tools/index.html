      <h1 data-i18n-zh="免费测算工具" data-i18n-en="Free calculators"></h1>
      <p data-i18n-zh="几分钟得到量级判断，用于商务沟通。正式核算与核查仍按项目交付。" data-i18n-en="Get an order-of-magnitude view in minutes for planning talks. Formal calculation and verification still run as a project."></p>

            CBAM CALCULATOR
          </span>

          <p data-i18n-zh="按 CN Code、出口量与核算年份估算证书数量与成本区间。完整计算器已独立设计，在新标签中打开，可调整参数并查看结果明细。" data-i18n-en="Estimate certificate volumes and cost ranges by CN code, export volume and year. The full calculator opens in a new tab—adjust inputs and review the breakdown."></p>
          <div class="tool-feature__actions">
            <a class="button button--primary" href="../calculator/" target="_blank" rel="noopener" data-i18n-zh="打开完整计算器" data-i18n-en="Open full calculator"></a>
            <a class="button button--ghost" href="../Lumino%20联系.dc.html?serviceId=cbam&source=tools" data-i18n-zh="预约正式核算" data-i18n-en="Book a formal calculation"></a>

        </div>
        <div class="tool-feature__shot" aria-hidden="true">
          <div class="tool-feature__shot-row"></div>
          <div class="tool-feature__shot-row"></div>
          <div class="tool-feature__shot-row"></div>
          <div class="tool-feature__shot-caption">CBAM · dashboard preview</div>

      </article>

      <div class="tools-secondary">
        <a href="../Lumino%20联系.dc.html?serviceId=pcf&source=tools">
          <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
