<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>解决方案 · Lumino</title>
  <meta name="description" content="按行业看清法规压力、关键卡点与可落地路径；钢铁、铝材、纺织、包装等，我们熟悉并交付。">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/apps/site/site/site-v3.css">
  <script defer src="/apps/site/site/i18n.js"></script>
  <script defer src="/apps/site/site/site-shell.js"></script>
  <script defer src="/apps/site/site/industries.js"></script>
  <script defer src="/apps/site/site/float-tools.js"></script>
</head>
<body>
<lumino-header current="industries"></lumino-header>
<main id="main">
  <section class="ind-page-hero">
    <div class="ind-page-hero__media" aria-hidden="true">
      <img src="/apps/site/site/assets/hero.png" alt="" width="2400" height="1400" decoding="async">
    </div>
    <div class="ind-page-hero__mask" aria-hidden="true"></div>
    <div class="wrap ind-page-hero__copy">
      <p class="crumb"><a href="/apps/site/Lumino%20官网.dc.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="解决方案" data-i18n-en="Industries"></span></p>
      <h1 data-i18n-zh="按行业看清，下一步该做什么" data-i18n-en="See what to do next—by industry"></h1>
      <p data-i18n-zh="不同行业的法规、客户要求和常见卡点并不一样。选择你的行业，查看关键挑战、我们能帮你做到什么，以及建议优先推进的事项。" data-i18n-en="Rules, customer asks and blockers differ by industry. Pick yours to see the key challenges, what we can help you deliver, and what to advance first."></p>
    </div>
  </section>

  <div class="ind-pills-bar ind-pills-bar--dock" id="ind-pills-bar">
    <div class="wrap">
      <div class="ind-pills" id="ind-pills" role="tablist" aria-label="行业"></div>
    </div>
  </div>

  <div id="ind-detail"></div>

  <section class="m-section ind-cta-band">
    <div class="wrap m-closing">
      <div>
        <h2 data-i18n-zh="说清产品和时间，我们给出优先顺序" data-i18n-en="Tell us the products and deadline—we set the order of work"></h2>
        <p data-i18n-zh="按你的行业与客户要求，我们给出优先顺序、资料清单与交付范围。" data-i18n-en="Based on your industry and buyer asks, we set priorities, the document list and the delivery scope."></p>
      </div>
      <div class="m-closing__actions">
        <a class="button button--on-dark button--sm" id="ind-cta" href="/apps/site/Lumino%20联系.dc.html" data-i18n-zh="预约咨询" data-i18n-en="Book a consultation"></a>
      </div>
    </div>
  </section>
</main>
<lumino-footer></lumino-footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const i18n = window.LuminoI18n;
  const lang = i18n && i18n.detectLang() === "en" ? "en" : "zh";
  const t = (o) => (o && o.zh !== undefined ? o[lang] || o.zh : o);
  const list = window.LuminoIndustries || [];
  const params = new URLSearchParams(location.search);
  let current = params.get("industry") || (list[0] && list[0].id);
  const pills = document.getElementById("ind-pills");
  const detail = document.getElementById("ind-detail");
  const cta = document.getElementById("ind-cta");
  const imgById = {
    steel: "/apps/site/site/assets/industries/steel.png",
    aluminium: "/apps/site/site/assets/industries/aluminium.png",
    textile: "/apps/site/site/assets/industries/textile.png",
    packaging: "/apps/site/site/assets/industries/packaging.png",
    chem: "/apps/site/site/assets/industries/chemicals.png",
    elec: "/apps/site/site/assets/industries/electronics.png",
  };

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render() {
    const item = list.find((x) => x.id === current) || list[0];
    if (!item) {
      if (detail) {
        detail.innerHTML = `<section class="m-section"><div class="wrap"><p>${lang === "en" ? "Industry data failed to load. Please refresh." : "行业数据未能加载，请刷新页面。"}</p></div></section>`;
      }
      return;
    }
    if (!pills || !detail) return;
    pills.innerHTML = list.map((i) => {
      const on = i.id === item.id;
      return `<button type="button" role="tab" aria-selected="${on}" data-id="${i.id}" class="ind-pill${on ? " is-on" : ""}">${esc(t(i.name))}</button>`;
    }).join("");

    const L = {
      help: lang === "en" ? "How we help" : "我们能为你做的",
      chain: lang === "en" ? "Typical path" : "典型落地路径",
      pkg: lang === "en" ? "Priority work packages" : "优先推进的工作包",
      reqs: lang === "en" ? "What typically applies" : "常见适用要求",
      prep: lang === "en" ? "What you should have ready" : "建议提前准备的资料",
      deliv: lang === "en" ? "Deliverables" : "交付物",
      more: lang === "en"
        ? "Customer templates, surveys and disclosure portals—we deliver those on the same foundation as the services above."
        : "客户指定模板、供应链问卷、披露平台对接等，我们与上述服务在同一底座上交付。",
    };

    const tags = [...new Set((item.packages || []).map((p) => p.tag).filter(Boolean))];
    const tagHtml = tags.map((tag, i) =>
      `<span class="ind-chip${i === 0 ? " ind-chip--accent" : ""}">${esc(tag)}</span>`
    ).join("");

    const helps = (item.helps || []).map(([a, b]) =>
      `<article class="ind-help-card">
        <span class="m-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
        <strong>${esc(t(a))}</strong>
        <span>${esc(t(b))}</span>
      </article>`
    ).join("");

    const chain = (item.chain || []).map((step, i) => {
      const last = i === (item.chain.length - 1);
      return `<li class="ind-step${i === 0 ? " is-first" : ""}">
        <div class="ind-step__rail">
          <span class="ind-step__n">${String(i + 1).padStart(2, "0")}</span>
          ${last ? "" : '<span class="ind-step__line" aria-hidden="true"></span>'}
        </div>
        <span class="ind-step__t">${esc(t(step))}</span>
      </li>`;
    }).join("");

    const pkgs = (item.packages || []).map((p, i) => {
      const bullets = (p.bullets || []).map((b) =>
        `<li><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg><span>${esc(t(b))}</span></li>`
      ).join("");
      return `<article class="ind-pkg-card">
        <div class="ind-pkg-card__body">
          <div class="ind-pkg-card__meta"><span class="mono">${String(i + 1).padStart(2, "0")}</span><span class="ind-chip ind-chip--accent">${esc(p.tag || "")}</span></div>
          <h4>${esc(t(p.title))}</h4>
          <p>${esc(t(p.body))}</p>
        </div>
        <div class="ind-pkg-card__foot">
          <span class="ind-pkg-card__foot-label">${L.deliv}</span>
          <ul>${bullets}</ul>
        </div>
      </article>`;
    }).join("");

    const reqs = (item.reqs || []).map(([a, b]) =>
      `<div class="ind-req-row"><strong>${esc(t(a))}</strong><span>${esc(t(b))}</span></div>`
    ).join("");

    const prep = (item.prepare || []).map((x) =>
      `<li><span class="ind-check" aria-hidden="true"></span><span>${esc(t(x))}</span></li>`
    ).join("");

    const img = imgById[item.id] || imgById.steel;
    const imgAlt = esc(t(item.name));

    detail.innerHTML = `
      <section class="ind-band ind-band--intro">
        <div class="wrap ind-intro">
          <div class="ind-intro__copy">
            <div class="ind-chips">${tagHtml}</div>
            <h2>${esc(t(item.name))}</h2>
            <p class="ind-intro__tagline">${esc(t(item.tagline || item.challenge))}</p>
            <p class="ind-intro__bg">${esc(t(item.background || item.challenge))}</p>
          </div>
          <figure class="ind-intro__media">
            <img src="${img}" alt="${imgAlt}" width="1200" height="900" loading="lazy" decoding="async">
          </figure>
        </div>
      </section>

      <section class="ind-band ind-band--wash">
        <div class="wrap">
          <header class="ind-sec-head">
            <span class="ind-sec-num">01</span>
            <h3>${L.help}</h3>
          </header>
          <div class="ind-help-grid">${helps}</div>
        </div>
      </section>

      <section class="ind-band">
        <div class="wrap">
          <header class="ind-sec-head ind-sec-head--split">
            <div>
              <span class="ind-sec-num">02</span>
              <h3>${L.chain}</h3>
            </div>
            <p class="ind-sec-aside">${esc(t(item.challenge))}</p>
          </header>
          <ol class="ind-steps">${chain}</ol>
        </div>
      </section>

      <section class="ind-band ind-band--soft">
        <div class="wrap">
          <header class="ind-sec-head">
            <span class="ind-sec-num">03</span>
            <h3>${L.pkg}</h3>
          </header>
          <div class="ind-pkg-grid">${pkgs}</div>
          <p class="ind-more">${L.more}</p>
        </div>
      </section>

      <section class="ind-band">
        <div class="wrap ind-split">
          <div>
            <header class="ind-sec-head">
              <span class="ind-sec-num">04</span>
              <h3>${L.reqs}</h3>
            </header>
            <div class="ind-req-block">${reqs}</div>
          </div>
          <aside class="ind-prep">
            <header class="ind-sec-head ind-sec-head--on-dark">
              <span class="ind-sec-num">05</span>
              <h3>${L.prep}</h3>
            </header>
            <ul>${prep}</ul>
          </aside>
        </div>
      </section>`;

    if (cta) cta.href = `/apps/site/Lumino%20联系.dc.html?industry=${encodeURIComponent(item.id)}`;
    if (i18n) i18n.applyDataI18n(document);
    if (window.LuminoEnhanceChrome) window.LuminoEnhanceChrome(detail);
  }

  if (pills) {
    pills.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-id]");
      if (!btn) return;
      current = btn.getAttribute("data-id");
      const url = new URL(location.href);
      url.searchParams.set("industry", current);
      history.replaceState(null, "", url);
      render();
      if (detail) detail.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }
  render();
});
</script>
</body>
</html>
