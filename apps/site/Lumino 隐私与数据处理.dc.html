      <p class="crumb"><a href="Lumino%20官网.dc.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="隐私与数据处理" data-i18n-en="Privacy &amp; data"></span></p>
      <h1 data-i18n-zh="隐私与数据处理" data-i18n-en="Privacy and data processing"></h1>
      <p data-i18n-zh="说明我们如何收集、使用与保存官网咨询、试算线索以及签约后的服务资料。" data-i18n-en="How we collect, use and retain enquiry data, trial leads and contracted service materials."></p>
    </div>
  </section>

  <section class="m-section">
    <div class="wrap legal-doc">
      <p class="legal-doc__meta" data-i18n-zh="版本 1.2 · 最近更新 2026-10-30 · 个人信息处理主体：上海铄垣环保科技有限公司" data-i18n-en="Version 1.2 · Updated 2026-10-30 · Controller: Shanghai Shuoyuan Environmental Technology Co., Ltd."></p>

      <article>
        <h2 data-i18n-zh="1. 适用范围与处理主体" data-i18n-en="1. Scope and controller"></h2>
        <p data-i18n-zh="本说明适用于访问 Lumino 官网、提交咨询、使用公开试算工具或使用客户门户时发生的个人信息处理。Lumino 由上海铄垣环保科技有限公司运营；可通过 contact@lumino.tech 或官网联系页联系我们。签约项目还受服务协议、保密条款、数据处理附件及用户内容与数据许可条款约束。" data-i18n-en="This notice applies when you visit the Lumino website, submit an enquiry, use a public calculator or use the client portal. Lumino is operated by Shanghai Shuoyuan Environmental Technology Co., Ltd. Contact us at contact@lumino.tech or via the contact page. Contracted engagements are also governed by the service agreement, confidentiality terms, data-processing terms and the User Content and Data Licence Terms."></p>
      </article>

      <article>
        <h2 data-i18n-zh="2. 我们处理的信息" data-i18n-en="2. Information we process"></h2>
        <ul>
          <li data-i18n-zh="官网咨询：姓名、公司、工作邮箱、电话或微信、行业、关注服务、时间要求、需求说明、提交时间、来源和必要的跟进记录。" data-i18n-en="Website enquiries: name, company, work email, phone or WeChat, industry, services of interest, timeline, notes, submit time, source and necessary follow-up records."></li>
          <li data-i18n-zh="公开试算：输入和结果默认在浏览器本地处理；主动请求跟进时，我们还会处理公司、联系人及与该次试算有关的行业、CN Code、数量和估算摘要。" data-i18n-en="Public calculators: inputs and results are processed locally by default. If you request follow-up, we also process company and contact details plus the sector, CN Code, quantity and estimate summary for that run."></li>
          <li data-i18n-zh="客户门户：企业、工厂、产品、供应商、生产、能源、原材料、运输、排放活动数据，以及账单、台账、BOM、声明、证书、报告等证据文件和版本记录。" data-i18n-en="Client portal: company, site, product, supplier, production, energy, material, transport and emissions data, plus evidence such as invoices, ledgers, BOMs, declarations, certificates and reports, with version records."></li>
          <li data-i18n-zh="账户与安全：角色、授权范围、项目任务、请求时间、页面路径、浏览器用户代理和必要的安全日志。" data-i18n-en="Account and security: roles, authorised scope, project tasks, request time, page path, browser user agent and necessary security logs."></li>
        </ul>
        <p data-i18n-zh="企业资料中可能包含员工、供应商联系人等自然人的工作信息。提交方应确保具有合法提供这些信息的依据，并避免提交与服务无关的个人信息。公开表单不用于接收身份证件、个人金融信息、健康信息或敏感工厂底稿。" data-i18n-en="Business materials may contain work details of employees or supplier contacts. Submitters must have a lawful basis to provide them and should avoid unrelated personal data. Public forms are not for identity documents, personal financial or health data, or sensitive plant source files."></p>
      </article>

      <article>
        <h2 data-i18n-zh="3. 处理目的与依据" data-i18n-en="3. Purposes and legal bases"></h2>
        <ul>
          <li data-i18n-zh="回复咨询，判断适用服务，准备资料清单、范围、周期和报价。" data-i18n-en="Respond to enquiries and prepare service recommendations, data lists, scope, timing and quotes."></li>
          <li data-i18n-zh="按你的请求提供试算、诊断、演示或客户支持。" data-i18n-en="Provide calculators, diagnostics, demos or support at your request."></li>
          <li data-i18n-zh="订立和履行服务合同，完成数据采集、核算、报告、复核和交付。" data-i18n-en="Enter into and perform service contracts, including collection, calculation, reporting, review and delivery."></li>
          <li data-i18n-zh="管理账户、权限和项目，并保障网站、Portal 与接口安全。" data-i18n-en="Manage accounts, permissions and engagements, and secure the website, portal and APIs."></li>
          <li data-i18n-zh="履行法律、监管、审计和争议处理义务；在取得必要同意或具有其他合法依据时改进服务。" data-i18n-en="Meet legal, regulatory, audit and dispute obligations, and improve services where consent or another lawful basis applies."></li>
        </ul>
        <p data-i18n-zh="我们会依据同意、订立或履行合同所必需、履行法定义务或适用法律允许的其他依据开展处理。你可以撤回基于同意的处理；撤回不影响此前处理的合法性。我们不出售个人信息，也不会因你拒绝非必要处理而拒绝核心服务。" data-i18n-en="We rely on consent, steps necessary to enter into or perform a contract, legal obligations or other bases permitted by applicable law. You may withdraw consent without affecting earlier lawful processing. We do not sell personal data or deny core services because you reject non-essential processing."></p>
      </article>

      <article>
        <h2 data-i18n-zh="4. 线索处理与通知" data-i18n-en="4. Lead handling and notifications"></h2>
        <p data-i18n-zh="咨询线索可能写入 Lumino 服务端线索库，在授权的商务或运营线索收件箱中展示，并通过已配置的 Webhook 或邮件服务通知指定对接人。静态演示环境可能把记录暂存于当前浏览器并明确标记为本机记录。正式环境只有在服务端持久化成功后才应显示正式线索编号。" data-i18n-en="Enquiries may be stored in Lumino's server-side lead store, shown in an authorised BD or Ops inbox, and notified to designated staff through a configured webhook or email service. A static demo may keep a clearly labelled local record in the current browser. Production should show a formal lead ID only after server-side persistence succeeds."></p>
      </article>

      <article>
        <h2 data-i18n-zh="5. AI 辅助与人工确认" data-i18n-en="5. AI assistance and human confirmation"></h2>
        <p data-i18n-zh="Lumino 可以使用规则引擎或 AI 辅助识别文件、提取字段、发现缺口并生成建议。AI 建议应与已确认事实区分；涉及服务范围、核算边界、关键假设、正式结果和对外交付的决定由获得授权的人员确认或复核。我们不会仅依靠自动化处理对个人作出产生法律效果或类似重大影响的决定。" data-i18n-en="Lumino may use rules or AI to identify files, extract fields, find gaps and propose actions. AI proposals remain separate from confirmed facts; authorised people confirm or review service scope, boundaries, key assumptions, formal results and external deliverables. We do not rely solely on automated processing for decisions producing legal or similarly significant effects on individuals."></p>
      </article>

      <article>
        <h2 data-i18n-zh="6. 接收方与受托处理" data-i18n-en="6. Recipients and processors"></h2>
        <p data-i18n-zh="在必要范围内，信息可能由获得授权的 Lumino 商务、运营、顾问、专家、复核和技术人员，以及托管、存储、邮件、通知、协作、安全和客户支持服务商处理。按客户授权，指定的进口商、供应商或核查方也可能查看限定范围的资料。我们要求受托方按约定目的、保密和安全要求处理，不得自行改变目的。" data-i18n-en="Where necessary, data may be processed by authorised Lumino BD, Ops, consultants, experts, reviewers and technical staff, and by hosting, storage, email, notification, collaboration, security and support providers. With customer authorisation, named importers, suppliers or verifiers may view limited materials. Processors must follow agreed purposes, confidentiality and security requirements."></p>
      </article>

      <article>
        <h2 data-i18n-zh="7. 跨境处理" data-i18n-en="7. International transfers"></h2>
        <p data-i18n-zh="涉及欧盟进口商、境外核查方或境外技术服务商时，可能发生跨境访问或传输。我们会在实际发生前确认数据范围、接收方、目的、保存期限和适用机制，并履行告知、单独同意、合同、认证或安全评估等适用义务。在跨境路径尚未完成确认和合规配置前，不应默认向境外服务发送客户生产底稿或敏感材料。" data-i18n-en="Cross-border access or transfer may occur where EU importers, overseas verifiers or overseas technology providers are involved. Before it occurs, we confirm scope, recipient, purpose, retention and the applicable mechanism, and complete any required notice, separate consent, contract, certification or assessment. Customer production source files or sensitive materials should not be sent abroad by default before the path is approved."></p>
      </article>

      <article>
        <h2 data-i18n-zh="8. 保存与删除" data-i18n-en="8. Retention and deletion"></h2>
        <p data-i18n-zh="我们仅在实现目的所需的最短期间内保存信息，并考虑合同履行、法规、审计、争议和安全需要。咨询线索保存至跟进结束、你要求删除或达到经批准的保存期限；项目资料按合同与合规要求保存；安全和审计记录按风险与法定义务确定期限。期限届满后，我们将删除、匿名化或依法隔离保存。" data-i18n-en="We retain data only for the shortest period needed for its purpose, taking account of contracts, regulation, audit, disputes and security. Enquiries are kept until follow-up ends, you request deletion or the approved retention period expires; engagement records follow contract and compliance needs; security and audit records follow risk and law. We then delete, anonymise or legally restrict the data."></p>
      </article>

      <article>
        <h2 data-i18n-zh="9. 安全与访问控制" data-i18n-en="9. Security and access control"></h2>
        <p data-i18n-zh="我们根据风险采取最小权限、租户与对象范围控制、身份验证、传输保护、日志、版本记录、备份恢复和事件响应措施。任何工作人员线索、文件或项目接口在生产环境中必须启用身份验证，不得因未配置密钥而默认开放。发生可能影响你权益的安全事件时，我们会依法采取补救并履行通知义务。" data-i18n-en="We use risk-based measures including least privilege, tenant and object scoping, authentication, transport protection, logs, versions, recovery and incident response. Staff lead, file or project interfaces must be authenticated in production and must not default to open access when a key is missing. We remediate and notify as required if an incident may affect your rights."></p>
      </article>

      <article>
        <h2 data-i18n-zh="10. 你的权利" data-i18n-en="10. Your rights"></h2>
        <p data-i18n-zh="在适用法律规定的范围内，你可以请求了解、查阅、复制、更正、补充或删除个人信息，限制或拒绝特定处理，撤回同意，注销账户，或对自动化处理请求说明。请通过联系页或 contact@lumino.tech 提出请求。为保护信息安全，我们可能在最小必要范围内核验你的身份与授权。" data-i18n-en="Subject to applicable law, you may request information, access, copies, correction, completion or deletion, restrict or object to processing, withdraw consent, close an account or ask about automated processing. Contact us through the contact page or contact@lumino.tech. We may minimally verify identity and authority to protect the data."></p>
      </article>

      <article>
        <h2 data-i18n-zh="11. Cookie 与本地存储" data-i18n-en="11. Cookies and local storage"></h2>
        <p data-i18n-zh="当前官网没有启用分析、广告或跨站追踪 Cookie。必要的 localStorage 和 sessionStorage 用于语言、会话、核心功能、本地演示线索及重复提交控制。若以后启用分析、营销、会话回放或第三方媒体嵌入，我们会在其运行前提供分目的选择，并使拒绝和撤回与接受同样容易。" data-i18n-en="The current site does not use analytics, advertising or cross-site tracking cookies. Necessary localStorage and sessionStorage support language, sessions, core features, local demo leads and duplicate-submission control. If analytics, marketing, session replay or third-party media are later enabled, we will offer purpose-based choices before they run and make refusal and withdrawal as easy as acceptance."></p>
        <p><a class="m-link" href="Lumino%20Cookie%20与本地存储.dc.html" data-i18n-zh="查看 Cookie 与本地存储清单 →" data-i18n-en="View the cookie and local-storage list →"></a></p>
      </article>

      <article>
        <h2 data-i18n-zh="12. 用户内容与数据许可" data-i18n-en="12. User content and data licence"></h2>
        <p data-i18n-zh="客户保留原始材料和业务数据的权利。Lumino 仅取得接收、存储、整理、计算、复核和生成约定交付物所需的有限许可。未经另行明确授权，我们不会把可识别的客户内容用于公开案例、训练面向其他客户的通用模型、销售或无关产品开发。" data-i18n-en="Customers retain rights in their source materials and business data. Lumino receives only the limited licence needed to receive, store, organise, calculate, review and create agreed deliverables. Without separate express authorisation, identifiable customer content is not used for public cases, training general models for other customers, sale or unrelated product development."></p>
        <p><a class="m-link" href="Lumino%20用户内容与数据许可.dc.html" data-i18n-zh="查看用户内容与数据许可条款 →" data-i18n-en="View the User Content and Data Licence Terms →"></a></p>
      </article>

      <article>
        <h2 data-i18n-zh="13. 未成年人" data-i18n-en="13. Children"></h2>
        <p data-i18n-zh="Lumino 面向企业和专业用户，不以未成年人为目标。请勿提交未成年人的个人信息；如我们发现缺乏适当依据的此类信息，将采取删除或其他必要措施。" data-i18n-en="Lumino is for businesses and professionals, not children. Do not submit children's personal data. If we discover such data without an appropriate basis, we will delete it or take other necessary steps."></p>
      </article>

      <article>
        <h2 data-i18n-zh="14. 更新与联系" data-i18n-en="14. Updates and contact"></h2>
        <p data-i18n-zh="处理目的、信息类型、接收方、跨境路径或权利发生重大变化时，我们会更新版本和日期，并在需要时另行通知或重新取得同意。隐私问题和权利请求请发送至 contact@lumino.tech，或使用官网联系页。" data-i18n-en="We update the version and date when purposes, data types, recipients, transfers or rights change materially, and provide notice or seek renewed consent where required. Send privacy questions and rights requests to contact@lumino.tech or use the website contact page."></p>
        <p><a class="m-link" href="Lumino%20联系.dc.html" data-i18n-zh="前往联系页 →" data-i18n-en="Go to contact →"></a></p>
      </article>

      <p class="svc-more-note" data-i18n-zh="请勿通过公开表单提交敏感工厂原始数据、身份证件或与咨询无关的个人信息。签约后请使用约定的受控渠道提交正式资料。" data-i18n-en="Do not submit sensitive plant source data, identity documents or unrelated personal data through public forms. After contracting, use the agreed controlled channel for formal materials."></p>
    </div>
  </section>
</main>
