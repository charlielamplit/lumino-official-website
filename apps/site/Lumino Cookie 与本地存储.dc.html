    <h1 data-i18n-zh="Cookie 与本地存储" data-i18n-en="Cookies and local storage"></h1>
    <p data-i18n-zh="说明当前站点在你的设备上保存什么、为什么保存，以及何时需要征得同意。" data-i18n-en="What the current site stores on your device, why it is stored and when consent is required."></p>
  </div></section>
  <section class="m-section"><div class="wrap legal-doc">
    <p class="legal-doc__meta" data-i18n-zh="版本 1.0 · 最近更新 2026-10-30" data-i18n-en="Version 1.0 · Updated 2026-10-30"></p>
    <article><h2 data-i18n-zh="1. 当前结论" data-i18n-en="1. Current position"></h2><p data-i18n-zh="当前官网和 Portal 没有启用广告、跨站追踪、行为画像、会话回放或访问分析 Cookie。现有浏览器存储主要用于语言、会话、核心功能、Portal 演示状态、线索本地回退和重复提交控制，因此目前不展示“接受全部 Cookie”弹窗。" data-i18n-en="The current website and portal do not use advertising, cross-site tracking, profiling, session replay or analytics cookies. Existing browser storage supports language, sessions, core functions, portal demo state, local lead fallback and duplicate-submission control, so no ‘accept all cookies’ banner is currently shown."></p></article>
    <article><h2 data-i18n-zh="2. 当前存储清单" data-i18n-en="2. Current storage list"></h2><ul>
      <li><strong>lumino.lang</strong> — <span data-i18n-zh="保存语言偏好，直至你修改或清除站点数据。" data-i18n-en="Stores language preference until changed or site data is cleared."></span></li>
      <li><strong>lumino-contact-last</strong> — <span data-i18n-zh="在当前会话中防止重复提交相同咨询。" data-i18n-en="Prevents duplicate enquiry submission within the current session."></span></li>
      <li><strong>lumino.public.leads.v1</strong> — <span data-i18n-zh="仅在 API 不可用的静态演示或本地回退环境中保存本机线索；你可通过清除站点数据将其移除。" data-i18n-en="Stores local leads only in a static demo or local fallback when the API is unavailable; you can remove them by clearing site data."></span></li>
      <li><strong>Portal session/state keys</strong> — <span data-i18n-zh="保存当前角色、引导和演示工作流状态；退出、重置或清除站点数据后移除。" data-i18n-en="Store the current role, onboarding and demo workflow state; removed on sign-out, reset or clearing site data."></span></li>
      <li><strong>Staff session credential</strong> — <span data-i18n-zh="仅在获授权工作人员会话中用于身份验证，会话结束或退出后移除。" data-i18n-en="Used only to authenticate an authorised staff session and removed when the session ends or the user signs out."></span></li>
    </ul></article>
    <article><h2 data-i18n-zh="3. 何时需要同意" data-i18n-en="3. When consent is needed"></h2><p data-i18n-zh="如果以后接入访问分析、广告像素、营销归因、跨站识别、热图、会话回放、非必要 A/B 测试，或会主动向第三方发送访问数据的视频、地图、社交和客服组件，我们会在其运行前提供分目的选择。非必要功能默认关闭。" data-i18n-en="If we later add analytics, ad pixels, marketing attribution, cross-site identification, heatmaps, session replay, non-essential A/B testing, or video, maps, social or chat components that send visit data to third parties, we will offer purpose-based choices before they run. Non-essential features will be off by default."></p></article>
    <article><h2 data-i18n-zh="4. 管理和清除" data-i18n-en="4. Manage and clear"></h2><p data-i18n-zh="你可以通过浏览器站点数据设置清除 Cookie、本地存储和会话存储。清除后，语言、Portal 演示状态和本地线索可能被重置。未来如启用非必要技术，页脚将持续提供 Cookie 设置入口，撤回与接受同样容易。" data-i18n-en="You can clear cookies, local storage and session storage through your browser's site-data settings. This may reset language, portal demo state and local leads. If non-essential technologies are enabled later, the footer will provide persistent cookie settings and withdrawal will be as easy as acceptance."></p></article>
    <p><a class="m-link" href="Lumino%20隐私与数据处理.dc.html" data-i18n-zh="返回隐私与数据处理说明 →" data-i18n-en="Back to Privacy and Data Processing →"></a></p>
  </div></section>
