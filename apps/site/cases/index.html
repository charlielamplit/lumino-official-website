<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目案例 · Lumino</title>
  <meta name="description" content="Lumino 碳与 ESG 合规服务项目案例。">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/apps/site/site/site-v3.css">
  <script defer src="/apps/site/site/i18n.js"></script>
  <script defer src="/apps/site/site/site-shell.js"></script>
  <script defer src="/apps/site/site/cases.js"></script>
  <script defer src="/apps/site/site/float-tools.js"></script>
</head>
<body>
<lumino-header current="industries"></lumino-header>
<main id="main">
  <section class="m-page-hero m-page-hero--compact">
    <div class="wrap">
      <p class="crumb"><a href="../Lumino%20官网.dc.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="项目案例" data-i18n-en="Project cases"></span></p>
      <h1 data-i18n-zh="项目案例" data-i18n-en="Project cases"></h1>
    </div>
  </section>
  <section class="m-section">
    <div class="wrap">
      <div class="case-stack" id="case-list"></div>
    </div>
  </section>
</main>
<lumino-footer></lumino-footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const i18n = window.LuminoI18n;
  const lang = i18n ? i18n.detectLang() : "zh";
  document.getElementById("case-list").innerHTML = (window.LuminoCases || [])
    .map((c) => window.LuminoRenderCaseRow(c, lang))
    .join("");
  if (i18n) i18n.applyDataI18n(document);
  if (window.LuminoEnhanceChrome) window.LuminoEnhanceChrome(document.getElementById("case-list"));
});
</script>
</body>
</html>
