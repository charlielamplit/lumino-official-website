<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>服务案例 · Lumino</title>
  <meta name="description" content="匿名化项目案例。方括号内为待确认事实。">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/apps/site/site/site-v3.css">
  <script defer src="/apps/site/site/i18n.js"></script>
  <script defer src="/apps/site/site/site-shell.js"></script>
  <script defer src="/apps/site/site/cases.js"></script>
  <script defer src="/apps/site/site/float-tools.js"></script>
</head>
<body>
<lumino-header current="industries"></lumino-header>
<main id="main">
  <section class="m-page-hero m-page-hero--compact">
    <div class="wrap">
      <p class="crumb"><a href="../Lumino%20官网.dc.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="服务案例" data-i18n-en="Case studies"></span></p>
      <h1 data-i18n-zh="我们做过的项目" data-i18n-en="Recent work"></h1>
      <p data-i18n-zh="客户名称已匿名，项目内容经客户同意后公开。" data-i18n-en="Client names are withheld. Details are shared with permission."></p>
    </div>
  </section>
  <section class="m-section">
    <div class="wrap">
      <div class="case-stack" id="case-list"></div>
      <p class="m-note" data-i18n-zh="原型说明：方括号内为待填写的真实项目数据，请勿使用示例数值上线。" data-i18n-en="Prototype note: bracketed values are placeholders for real project data."></p>
    </div>
  </section>
</main>
<lumino-footer></lumino-footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const i18n = window.LuminoI18n;
  const lang = i18n ? i18n.detectLang() : "zh";
  document.getElementById("case-list").innerHTML = (window.LuminoCases || [])
    .map((c) => window.LuminoRenderCaseRow(c, lang))
    .join("");
  if (i18n) i18n.applyDataI18n(document);
  if (window.LuminoEnhanceChrome) window.LuminoEnhanceChrome(document.getElementById("case-list"));
});
</script>
</body>
</html>
