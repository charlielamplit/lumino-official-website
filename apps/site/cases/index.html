<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>典型服务场景 · Lumino</title>
  <meta name="description" content="Lumino 碳与 ESG 合规服务场景示例。">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/apps/site/site/site-v3.css">
  <script defer src="/apps/site/site/i18n.js"></script>
  <script defer src="/apps/site/site/site-shell.js"></script>
  <script defer src="/apps/site/site/cases.js"></script>
  <script defer src="/apps/site/site/float-tools.js"></script>
</head>
<body>
<lumino-header current="industries"></lumino-header>
<main id="main">
  <section class="m-page-hero m-page-hero--compact">
    <div class="wrap">
      <p class="crumb"><a href="../home.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="典型服务场景" data-i18n-en="Typical service scenarios"></span></p>
      <h1 data-i18n-zh="典型服务场景" data-i18n-en="Typical service scenarios"></h1>
    </div>
  </section>
  <section class="m-section">
    <div class="wrap">
      <p data-i18n-zh="以下为服务场景示例，用于说明工作内容，不代表已完成的客户项目。" data-i18n-en="These illustrative scenarios explain possible work and do not represent completed client projects."></p>
      <div class="case-stack" id="case-list"></div>
    </div>
  </section>
</main>
<lumino-footer></lumino-footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const i18n = window.LuminoI18n;
  const lang = i18n ? i18n.detectLang() : "zh";
  document.getElementById("case-list").innerHTML = (window.LuminoCases || [])
    .map((c) => window.LuminoRenderCaseRow(c, lang))
    .join("");
  if (i18n) i18n.applyDataI18n(document);
  if (window.LuminoEnhanceChrome) window.LuminoEnhanceChrome(document.getElementById("case-list"));
});
</script>
</body>
</html>
