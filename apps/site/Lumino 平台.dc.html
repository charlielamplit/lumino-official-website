  <meta name="description" content="资料准备一次，多项服务共用；AI 整理、专家复核、企业确认。">

  <link rel="stylesheet" href="/apps/site/site/site-v3.css">
  <script defer src="/apps/site/site/i18n.js"></script>

</head>
<body>
<lumino-header current="platform"></lumino-header>
<main id="main">
  <section class="m-page-hero m-page-hero--compact">
    <div class="wrap">
      <p class="crumb"><a href="Lumino%20官网.dc.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="我们的平台" data-i18n-en="Platform"></span></p>
      <h1 data-i18n-zh="资料准备一次，多项服务共用" data-i18n-en="Prepare your records once. Use them across services."></h1>
      <p data-i18n-zh="企业、工厂、产品和证明材料保存在同一个平台。每项服务独立确认、独立核算、独立交付。" data-i18n-en="Company, site and product records live in one place. Each service confirms, calculates and delivers on its own."></p>
    </div>
  </section>

  <section class="m-section">
    <div class="wrap pf-stack">
      <h2 class="pf-h2" data-i18n-zh="一个平台，六项核心服务频道" data-i18n-en="One platform, six core service channels"></h2>
      <div class="pf-map">
        <div class="pf-map__channels">
          <a href="services/cbam/"><span class="mono">CBAM</span><strong data-i18n-zh="欧盟碳边境调节" data-i18n-en="EU CBAM"></strong><em data-i18n-zh="了解服务 →" data-i18n-en="Learn more →"></em></a>
          <a href="services/pcf/"><span class="mono">PCF</span><strong data-i18n-zh="产品碳足迹" data-i18n-en="Product carbon footprint"></strong><em data-i18n-zh="了解服务 →" data-i18n-en="Learn more →"></em></a>
          <a href="services/esg/"><span class="mono">ESG</span><strong data-i18n-zh="ESG 报告" data-i18n-en="ESG reporting"></strong><em data-i18n-zh="了解服务 →" data-i18n-en="Learn more →"></em></a>
          <a href="services/ghg-inventory/"><span class="mono">GHG</span><strong data-i18n-zh="碳盘查" data-i18n-en="GHG inventory"></strong><em data-i18n-zh="了解服务 →" data-i18n-en="Learn more →"></em></a>
          <a href="services/carbon-assets/"><span class="mono">EAC</span><strong data-i18n-zh="碳资产与绿证" data-i18n-en="Carbon assets & EACs"></strong><em data-i18n-zh="了解服务 →" data-i18n-en="Learn more →"></em></a>
          <a href="services/export-compliance/"><span class="mono">TRADE</span><strong data-i18n-zh="出口合规" data-i18n-en="Export compliance"></strong><em data-i18n-zh="了解服务 →" data-i18n-en="Learn more →"></em></a>
        </div>
        <div class="pf-map__workspaces">
          <div><strong data-i18n-zh="工作台" data-i18n-en="Workspace"></strong><span data-i18n-zh="当前事项与进度" data-i18n-en="Today’s work and progress"></span></div>
          <div><strong data-i18n-zh="我的任务" data-i18n-en="My tasks"></strong><span data-i18n-zh="负责人与截止日期" data-i18n-en="Owners and due dates"></span></div>
          <div><strong data-i18n-zh="数据资产" data-i18n-en="Data assets"></strong><span data-i18n-zh="资料、版本与引用" data-i18n-en="Records, versions, usage"></span></div>
          <div><strong data-i18n-zh="交付中心" data-i18n-en="Deliverables"></strong><span data-i18n-zh="报告、审批与回执" data-i18n-en="Reports and approvals"></span></div>
          <div><strong data-i18n-zh="企业与权限" data-i18n-en="Access"></strong><span data-i18n-zh="角色与可见范围" data-i18n-en="Roles and visibility"></span></div>
        </div>
        <div class="pf-map__foundation">
          <strong data-i18n-zh="企业数据底座" data-i18n-en="Shared company data"></strong>
          <div class="m-chips m-chips--on-soft">
            <span data-i18n-zh="企业" data-i18n-en="Company"></span>
            <span data-i18n-zh="工厂" data-i18n-en="Sites"></span>
            <span data-i18n-zh="产品" data-i18n-en="Products"></span>
            <span data-i18n-zh="能源与生产台账" data-i18n-en="Energy & output"></span>
            <span data-i18n-zh="证明材料" data-i18n-en="Evidence"></span>
          </div>
        </div>
      </div>
      <p class="svc-more-note" data-i18n-zh="六项服务共用同一数据底座。客户与市场的合规、披露要求，我们在平台上统一承接与交付。" data-i18n-en="All six services share one data foundation. Compliance and disclosure asks from buyers and markets run and deliver on the same platform."></p>
    </div>
  </section>

  <section class="m-section m-section--wash">
    <div class="wrap pf-stack">
      <header class="m-section__head">
        <div class="m-section__copy">
          <h2 data-i18n-zh="AI 负责整理，专家负责复核，你确认业务事实" data-i18n-en="AI organises, experts review, you confirm the facts"></h2>
          <p data-i18n-zh="每一步由谁完成都有记录，正式结果始终可以追溯到原始资料。" data-i18n-en="Every step is recorded, so each result traces back to its source."></p>
        </div>
      </header>
      <div class="svc-steps svc-steps--platform">
        <div class="svc-step svc-step--ink">
          <div class="svc-step__head">
            <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/><circle cx="9" cy="9" r="1"/></svg></span>
            <span class="mono">01 · AI</span>
          </div>
          <strong data-i18n-zh="整理与提示" data-i18n-en="Organise & flag"></strong>
          <span data-i18n-zh="识别文件、提取数据、发现缺口，结果作为待确认建议。" data-i18n-en="Reads documents, extracts data and flags gaps, as suggestions to confirm."></span>
        </div>
        <div class="svc-step svc-step--ink">
          <div class="svc-step__head">
            <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11.5 18.5 15 16 12.5"/></svg></span>
            <span class="mono">02 · 企业</span>
          </div>
          <strong data-i18n-zh="确认业务事实" data-i18n-en="Confirm the facts"></strong>
          <span data-i18n-zh="授权人员核对数据与用途，并留下确认记录。" data-i18n-en="Authorised staff check data and its use, with a record of who confirmed."></span>
        </div>
        <div class="svc-step svc-step--ink">
          <div class="svc-step__head">
            <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/></svg></span>
            <span class="mono">03 · 引擎</span>
          </div>
          <strong data-i18n-zh="确定性计算" data-i18n-en="Calculate"></strong>
          <span data-i18n-zh="按锁定的数据、因子与规则计算，结果可复现。" data-i18n-en="Runs on locked data, factors and rules, so results can be reproduced."></span>
        </div>
        <div class="svc-step svc-step--ink">
          <div class="svc-step__head">
            <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <span class="mono">04 · 专家</span>
          </div>
          <strong data-i18n-zh="复核与交付" data-i18n-en="Review & deliver"></strong>
          <span data-i18n-zh="检查方法与证据，复核后锁定正式交付版本。" data-i18n-en="Check method and evidence, then lock the delivered version."></span>
        </div>
      </div>
    </div>
  </section>

  <section class="m-section">
    <div class="wrap pf-stack">
      <header class="m-section__head">
        <div class="m-section__copy">
          <h2 data-i18n-zh="平台如何处理数据" data-i18n-en="How the platform handles data"></h2>
          <p data-i18n-zh="左侧说明资料如何经 Agent 整理后进入正式事实，并分发到各服务；右侧说明租户隔离、授权范围与提议/事实分车道。" data-i18n-en="Left: how Agent-organised data becomes confirmed facts and fans out to services. Right: tenant isolation, scoped access, and the proposal vs fact lanes."></p>
        </div>
      </header>

      <div class="pf-diagrams" id="pf-diagrams">
        <figure class="pf-diagram">
          <div class="pf-diagram__canvas" role="img" aria-label="数据同源 Agent 流向">
            <div class="pf-flow">
              <header class="pf-diagram__bar">
                <span class="mono">FLOW</span>
                <strong data-i18n-zh="同源整理路径" data-i18n-en="Shared-source path"></strong>
                <em data-i18n-zh="一份资料 → 多项服务" data-i18n-en="One record → many services"></em>
              </header>
              <div class="pf-flow__lane">
                <div class="pf-flow__node">
                  <span class="mono">01</span>
                  <strong data-i18n-zh="原始资料" data-i18n-en="Source files"></strong>
                  <em data-i18n-zh="台账 · 发票 · 证明" data-i18n-en="Ledgers · invoices · proofs"></em>
                </div>
                <span class="pf-flow__arrow" aria-hidden="true"></span>
                <div class="pf-flow__node pf-flow__node--ai">
                  <span class="mono">02</span>
                  <strong data-i18n-zh="AI Agent" data-i18n-en="AI Agent"></strong>
                  <em data-i18n-zh="提取 · 对齐 · 标缺口" data-i18n-en="Extract · align · flag gaps"></em>
                </div>
                <span class="pf-flow__arrow" aria-hidden="true"></span>
                <div class="pf-flow__node">
                  <span class="mono">03</span>
                  <strong data-i18n-zh="企业确认" data-i18n-en="You confirm"></strong>
                  <em data-i18n-zh="提议 → 正式事实" data-i18n-en="Proposal → fact"></em>
                </div>
                <span class="pf-flow__arrow" aria-hidden="true"></span>
                <div class="pf-flow__node">
                  <span class="mono">04</span>
                  <strong data-i18n-zh="引擎计算" data-i18n-en="Engine"></strong>
                  <em data-i18n-zh="锁定输入可复现" data-i18n-en="Locked, reproducible"></em>
                </div>
                <span class="pf-flow__arrow" aria-hidden="true"></span>
                <div class="pf-flow__node">
                  <span class="mono">05</span>
                  <strong data-i18n-zh="专家复核" data-i18n-en="Expert review"></strong>
                  <em data-i18n-zh="锁定交付版本" data-i18n-en="Lock delivery"></em>
                </div>
              </div>
              <div class="pf-flow__gates">
                <div class="pf-flow__gate pf-flow__gate--muted">
                  <strong data-i18n-zh="提议车道" data-i18n-en="Proposal lane"></strong>
                  <span data-i18n-zh="Agent 结果仅作待确认建议，未确认不得进入正式计算。" data-i18n-en="Agent output stays as suggestions—never enters formal runs until confirmed."></span>
                </div>
                <div class="pf-flow__gate pf-flow__gate--solid">
                  <strong data-i18n-zh="正式事实车道" data-i18n-en="Fact lane"></strong>
                  <span data-i18n-zh="授权人员确认后，才写入可引用的企业事实并保留确认人。" data-i18n-en="Only after authorised confirmation does it become a citeable company fact."></span>
                </div>
              </div>
              <div class="pf-flow__services">
                <span class="mono">CBAM</span>
                <span class="mono">PCF</span>
                <span class="mono">ESG</span>
                <span class="mono">GHG</span>
                <span class="mono">EAC</span>
                <span class="mono">TRADE</span>
              </div>
              <p class="pf-flow__base" data-i18n-zh="同一企业数据底座：一份资料可被多项服务引用，互不覆盖" data-i18n-en="One company data foundation—one record, many service uses, no overwrite"></p>
            </div>
          </div>
          <figcaption>
            <strong data-i18n-zh="数据同源 · Agent 流向" data-i18n-en="Shared source · Agent flow"></strong>
            <span data-i18n-zh="AI 只产出待确认提议；确认后进入正式计算，再分发到各服务频道。" data-i18n-en="AI only proposes; confirmed facts feed formal runs, then each service channel."></span>
          </figcaption>
        </figure>

        <figure class="pf-diagram">
          <div class="pf-diagram__canvas" role="img" aria-label="数据隐私与权限架构">
            <div class="pf-trust">
              <div class="pf-trust__shell">
                <header class="pf-diagram__bar pf-diagram__bar--in-shell">
                  <span class="mono">TENANT</span>
                  <strong data-i18n-zh="企业租户边界" data-i18n-en="Tenant boundary"></strong>
                  <em data-i18n-zh="跨租户不可见" data-i18n-en="No cross-tenant visibility"></em>
                </header>
                <div class="pf-trust__grid">
                  <div class="pf-trust__box">
                    <strong data-i18n-zh="角色 × 对象授权" data-i18n-en="Role × object ACL"></strong>
                    <span data-i18n-zh="客户 · 专家 · 复核 · 运营分权；角色名不能替代范围授权。" data-i18n-en="Customer · expert · reviewer · ops—role names alone are not enough."></span>
                  </div>
                  <div class="pf-trust__box">
                    <strong data-i18n-zh="服务用途绑定" data-i18n-en="Service-bound use"></strong>
                    <span data-i18n-zh="可见范围随当前服务任务收缩，避免一次打开全部资料。" data-i18n-en="Visibility shrinks to the active service task—not the whole archive."></span>
                  </div>
                  <div class="pf-trust__box pf-trust__box--muted">
                    <strong data-i18n-zh="提议通道" data-i18n-en="Proposal lane"></strong>
                    <span data-i18n-zh="AI / 规则建议带有来源说明；未确认不入账、不参与交付。" data-i18n-en="AI / rules cite sources; unconfirmed items never book or deliver."></span>
                  </div>
                  <div class="pf-trust__box pf-trust__box--solid">
                    <strong data-i18n-zh="正式事实" data-i18n-en="Confirmed facts"></strong>
                    <span data-i18n-zh="原件不可覆盖；更正生成新修订，版本链可回溯。" data-i18n-en="Immutable originals; corrections become new revisions on a chain."></span>
                  </div>
                </div>
                <footer class="pf-trust__lock">
                  <span class="mono">LOCK</span>
                  <strong data-i18n-zh="专家复核后锁定交付" data-i18n-en="Locked after expert review"></strong>
                  <em data-i18n-zh="操作留痕 · 证据可导出" data-i18n-en="Audit trail · exportable evidence"></em>
                </footer>
              </div>
            </div>
          </div>
          <figcaption>
            <strong data-i18n-zh="数据隐私 · 权限架构" data-i18n-en="Privacy · access architecture"></strong>
            <span data-i18n-zh="按「租户—对象—角色—服务用途」控可见范围；提议与正式事实分车道。" data-i18n-en="Visibility by tenant, object, role and service use; proposals stay off the fact lane."></span>
          </figcaption>
        </figure>
      </div>
    </div>
  </section>

  <section class="m-section m-section--wash pf-sec-block">
    <div class="wrap pf-stack">
      <header class="m-section__head">
        <div class="m-section__copy">
          <h2 data-i18n-zh="数据安全与可信交付" data-i18n-en="Data security and trustworthy delivery"></h2>
          <p class="sec-lead" data-i18n-zh="合规数据涉及产能、能耗与供应链细节。Lumino 按「租户—对象—角色—服务用途」控制可见范围；原始资料不可覆盖；AI 只形成待确认提议；正式结果由确定性规则计算，并经专家复核后锁定。" data-i18n-en="Compliance data covers production, energy and supply-chain detail. Lumino scopes visibility by tenant, object, role and service use. Originals are immutable; AI only proposes; formal results are calculated by deterministic rules and locked after expert review."></p>
        </div>
      </header>
      <div class="sec-grid">
        <article class="sec-card">
          <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <h3 data-i18n-zh="按角色与对象授权" data-i18n-en="Role- and object-scoped access"></h3>
          <p data-i18n-zh="成员只看到职责范围内的企业、对象与服务数据，角色名不能替代范围授权。" data-i18n-en="People see only companies, objects and services in their remit—role names alone are not enough."></p>
          <ul><li data-i18n-zh="企业租户隔离" data-i18n-en="Tenant isolation"></li><li data-i18n-zh="按对象与服务绑定授权" data-i18n-en="Authorisation by object and service binding"></li><li data-i18n-zh="客户、专家、复核、运营分权" data-i18n-en="Customer, expert, reviewer and ops separated"></li></ul>
        </article>
        <article class="sec-card">
          <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6"/><path d="M9 11h6"/><path d="M12 11v4"/></svg></span>
          <h3 data-i18n-zh="原始资料不可覆盖" data-i18n-en="Immutable source records"></h3>
          <p data-i18n-zh="上传原件保留首版；更正生成新修订，并通过版本链回溯。" data-i18n-en="Uploaded originals keep version one; corrections create a new revision linked in the chain."></p>
          <ul><li data-i18n-zh="修订不可原位覆盖" data-i18n-en="No in-place overwrite"></li><li data-i18n-zh="绑定锁定具体版本号" data-i18n-en="Bindings lock a version id"></li><li data-i18n-zh="保留来源与采集时间" data-i18n-en="Source and capture time retained"></li></ul>
        </article>
        <article class="sec-card">
          <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8"/><path d="M7.5 7.5 11 16"/><path d="M16.5 7.5 13 16"/></svg></span>
          <h3 data-i18n-zh="提议与正式事实分离" data-i18n-en="Proposals stay separate from facts"></h3>
          <p data-i18n-zh="AI 与自动规则只能生成待确认提议；授权人员确认后才进入正式事实。" data-i18n-en="AI and automation only create proposals; authorised people confirm before facts go live."></p>
          <ul><li data-i18n-zh="提议带有来源说明" data-i18n-en="Proposals cite their source"></li><li data-i18n-zh="未确认不得进入正式计算" data-i18n-en="Unconfirmed items never enter formal runs"></li><li data-i18n-zh="确认人与时间可查" data-i18n-en="Who confirmed, and when, is logged"></li></ul>
        </article>
        <article class="sec-card">
          <span class="m-icon m-icon--ghost" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/></svg></span>
          <h3 data-i18n-zh="确定性计算可复现" data-i18n-en="Deterministic, reproducible runs"></h3>
          <p data-i18n-zh="正式结果按锁定输入、因子与规则版本计算，同一输入可重复得到同一结果。" data-i18n-en="Formal results run on locked inputs, factors and rule versions—same input, same output."></p>
          <ul><li data-i18n-zh="规则与公式版本化" data-i18n-en="Rules and formulas versioned"></li><li data-i18n-zh="计算血缘可追踪" data-i18n-en="Calculation lineage tracked"></li><li data-i18n-zh="重算记录保留" data-i18n-en="Reruns are retained"></li></ul>
        </article>
        <article class="sec-card">
