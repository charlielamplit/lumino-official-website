<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>行业知识库 · Lumino</title>
  <meta name="description" content="按行业整理最新法规、行业规则与常见问题。">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/apps/site/site/site-v3.css">
  <script defer src="/apps/site/site/i18n.js"></script>
  <script defer src="/apps/site/site/site-shell.js"></script>
  <script defer src="/apps/site/site/float-tools.js"></script>
  <script defer src="/packages/shared/knowledge-client.js"></script>
</head>
<body>
<lumino-header current="knowledge"></lumino-header>
<main id="main">
  <section class="m-page-hero m-page-hero--compact">
    <div class="wrap">
      <p class="crumb"><a href="../Lumino%20官网.dc.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="行业知识库" data-i18n-en="Insights"></span></p>
      <h1 data-i18n-zh="按行业了解最新要求" data-i18n-en="The latest requirements, by industry"></h1>
      <p data-i18n-zh="按行业整理最新法规、行业规则与常见问题。" data-i18n-en="The latest rules, industry guidance and common questions, organised by industry."></p>
    </div>
  </section>
  <section class="m-section" style="padding-top:28px">
    <div class="wrap">
      <div class="kb-filters" id="kb-filters">
        <div class="kb-filter-row">
          <span class="kb-filter-label" data-i18n-zh="行业" data-i18n-en="Industry"></span>
          <div class="m-filters" id="kb-ind">
            <button type="button" data-industry="all" aria-pressed="true">全部</button>
            <button type="button" data-industry="steel">钢铁</button>
            <button type="button" data-industry="aluminium">铝</button>
            <button type="button" data-industry="textile">纺织服装</button>
            <button type="button" data-industry="packaging">包装</button>
            <button type="button" data-industry="chem">化工</button>
            <button type="button" data-industry="elec">电子电器</button>
          </div>
        </div>
        <div class="kb-filter-row">
          <span class="kb-filter-label" data-i18n-zh="类型" data-i18n-en="Type"></span>
          <div class="m-filters" id="kb-type">
            <button type="button" data-type="all" aria-pressed="true">全部</button>
            <button type="button" data-type="reg">法规解读</button>
            <button type="button" data-type="method">方法指南</button>
            <button type="button" data-type="qa">实务问答</button>
          </div>
        </div>
      </div>
      <div class="ins-grid" id="kb-list"></div>
    </div>
  </section>
</main>
<lumino-footer></lumino-footer>
<script>
(function () {
  let articles = [];
  let industry = new URLSearchParams(location.search).get("industry") || "all";
  let type = "all";

  function lang() {
    return window.LuminoI18n && window.LuminoI18n.detectLang() === "en" ? "en" : "zh";
  }

  function pick(obj, L) {
    if (!obj) return "";
    if (typeof obj === "string") return obj;
    return obj[L] || obj.zh || obj.en || "";
  }

  function render() {
    const L = lang();
    const filtered = articles.filter((a) => a.status === "published")
      .filter((a) => (industry === "all" || (a.industries || []).includes(industry)) && (type === "all" || a.type === type));
    const host = document.getElementById("kb-list");
    const empty = L === "en"
      ? "Nothing published for this filter yet. Browse CBAM guide or contact us."
      : "该筛选下暂无已发布内容。可查看 CBAM 指南，或提交咨询。";
    host.innerHTML = filtered.map((a) => {
      const href = `/apps/site/knowledge/article.html?id=${encodeURIComponent(a.id)}`;
      return `<a class="ins-card" href="${href}"><span class="meta">${pick(a.typeLabel, L)} · ${pick(a.industryLabel, L)}</span><h3>${pick(a.title, L)}</h3><p>${pick(a.lead, L)}</p></a>`;
    }).join("") || `<p style="color:var(--muted)">${empty} <a class="m-link" href="cbam-guide.html">${L === "en" ? "CBAM guide →" : "CBAM 指南 →"}</a></p>`;
    document.querySelectorAll("#kb-ind [data-industry]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.industry === industry)));
    document.querySelectorAll("#kb-type [data-type]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.type === type)));
  }

  async function boot() {
    try {
      const client = window.LuminoKnowledgeClient;
      if (client) {
        const data = await client.fetchArticles({ publicOnly: true });
        articles = data.articles || [];
      } else {
        const res = await fetch("/apps/site/knowledge/catalog.json", { cache: "no-store" });
        const data = await res.json();
        articles = (data.articles || []).filter((a) => a.status === "published");
      }
    } catch (_) {
      articles = [];
    }
    render();
    if (window.LuminoI18n) window.LuminoI18n.applyDataI18n(document);
    if (window.LuminoEnhanceChrome) window.LuminoEnhanceChrome(document.getElementById("kb-list"));
  }

  document.getElementById("kb-filters").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.industry) industry = b.dataset.industry;
    if (b.dataset.type) type = b.dataset.type;
    render();
    if (window.LuminoEnhanceChrome) window.LuminoEnhanceChrome(document.getElementById("kb-list"));
  });
  document.addEventListener("DOMContentLoaded", boot);
  window.addEventListener("lumino:langchange", render);
})();
</script>
</body>
</html>
