<script>
document.addEventListener("DOMContentLoaded", function () {
  const media = document.getElementById("hero-media");
  const img = media && media.querySelector("img");
  const ph = document.getElementById("hero-ph");
  if (img) {
    const show = () => { media.dataset.empty = "false"; if (ph) ph.hidden = true; };
    const hide = () => { media.dataset.empty = "true"; if (ph) ph.hidden = false; };
    img.addEventListener("load", show);
    img.addEventListener("error", hide);
    if (img.complete && img.naturalWidth) show();
    else hide();
  }
  if (window.LuminoI18n) window.LuminoI18n.applyDataI18n(document);
});
