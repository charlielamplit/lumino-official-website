    <h1 data-i18n-zh="用户内容与数据许可" data-i18n-en="User Content and Data Licence"></h1>
    <p data-i18n-zh="客户保留原始资料与业务数据的权利；Lumino 仅取得完成约定服务所需的有限许可。" data-i18n-en="Customers retain rights in their source materials and business data; Lumino receives only the limited licence needed to deliver the agreed services."></p>
  </div></section>
  <section class="m-section"><div class="wrap legal-doc">
    <p class="legal-doc__meta" data-i18n-zh="版本 1.0 · 最近更新 2026-10-30 · 具体项目需由服务协议明确引用" data-i18n-en="Version 1.0 · Updated 2026-10-30 · Engagements must incorporate these terms through the service agreement"></p>
    <article><h2 data-i18n-zh="1. 权利归属" data-i18n-en="1. Ownership"></h2><p data-i18n-zh="用户内容和原始业务数据继续归客户、提交方或相关权利人所有。本条款不向 Lumino 转让所有权、商业秘密或知识产权。Lumino 的平台软件、规则引擎、通用模板、方法和既有材料仍归 Lumino 或其许可方所有；专门交付物的权利按服务协议约定。" data-i18n-en="User content and source business data remain owned by the customer, submitter or relevant rights holder. These terms do not transfer ownership, trade secrets or intellectual property to Lumino. Lumino's platform software, rules, general templates, methods and pre-existing materials remain with Lumino or its licensors; bespoke deliverable rights follow the service agreement."></p></article>
    <article><h2 data-i18n-zh="2. 有限许可" data-i18n-en="2. Limited licence"></h2><p data-i18n-zh="提交方授权 Lumino 在约定服务范围和必要保存期内接收、存储、备份、安全扫描、解析、转换、整理、提取、计算、分析、复核和生成交付物，并按客户授权向指定人员或参与方展示或交付。该许可为非独占且不得扩大为与项目无关的使用。" data-i18n-en="The submitter authorises Lumino, within the agreed service scope and necessary retention period, to receive, store, back up, scan, parse, convert, organise, extract, calculate, analyse, review and create deliverables, and to display or deliver them to people or participants authorised by the customer. The licence is non-exclusive and may not expand to unrelated use."></p></article>
    <article><h2 data-i18n-zh="3. AI 使用边界" data-i18n-en="3. AI boundaries"></h2><p data-i18n-zh="AI 可以辅助分类、提取、匹配和生成建议，但建议应与客户确认事实分开，正式边界、关键假设、结果和交付物由授权人员确认或复核。未经另行明确授权，Lumino 不会使用可识别客户内容训练面向其他客户的通用模型、建立跨客户画像或基准、公开案例、销售或开展无关产品开发。" data-i18n-en="AI may assist classification, extraction, matching and proposals, but proposals remain separate from customer-confirmed facts and authorised people confirm or review formal boundaries, assumptions, results and deliverables. Without separate express authorisation, Lumino does not use identifiable customer content to train general models for other customers, build cross-customer profiles or benchmarks, publish cases, sell data or develop unrelated products."></p></article>
    <article><h2 data-i18n-zh="4. 提交方责任" data-i18n-en="4. Submitter responsibilities"></h2><p data-i18n-zh="提交方应有权提交相关材料，并已为其中的个人信息、第三方保密信息和知识产权取得必要授权或具有其他合法依据；应避免提交与服务无关的敏感个人信息、恶意代码或违法内容，并在材料错误、权利争议或授权变化时及时通知 Lumino。" data-i18n-en="Submitters must have the right to provide the materials and the necessary authority or other lawful basis for personal data, third-party confidential information and intellectual property within them. They should avoid unrelated sensitive personal data, malicious code or unlawful content, and promptly notify Lumino of errors, rights disputes or changes in authority."></p></article>
    <article><h2 data-i18n-zh="5. 访问、保密和分享" data-i18n-en="5. Access, confidentiality and sharing"></h2><p data-i18n-zh="Lumino 按租户、角色、项目对象、服务订单、年度、设施和授权范围控制访问。向进口商、核查员、供应商或其他外部参与方分享前，应记录对象、范围、目的、期限和可见内容。不同服务的确认不会自动扩大其他服务或参与方的访问权。" data-i18n-en="Lumino scopes access by tenant, role, project object, service order, year, facility and authorisation. Before sharing with importers, verifiers, suppliers or other external participants, the recipient, scope, purpose, duration and visible content should be recorded. Confirmation in one service does not automatically expand access for another service or participant."></p></article>
    <article><h2 data-i18n-zh="6. 导出、保留和删除" data-i18n-en="6. Export, retention and deletion"></h2><p data-i18n-zh="客户可按约定查看或导出其材料和交付物。服务终止或目的实现后，Lumino 按合同、法定保存和争议处理需要返还、删除、匿名化或隔离保存。备份残留可在正常覆盖周期内保留，但不得恢复用于新的业务目的。" data-i18n-en="Customers may access or export their materials and deliverables as agreed. When the service ends or the purpose is complete, Lumino returns, deletes, anonymises or restricts data according to contract, legal retention and dispute needs. Backup remnants may remain through normal overwrite cycles but may not be restored for new business purposes."></p></article>
    <article><h2 data-i18n-zh="7. 重大用途变化" data-i18n-en="7. Material purpose changes"></h2><p data-i18n-zh="公开案例、通用模型训练、跨客户基准、无关产品开发或新的外部分享不得仅通过修改隐私页面获得授权。Lumino 应在开始前说明新目的、范围、接收方、期限和影响，并取得合同变更或法律要求的单独授权。" data-i18n-en="Public cases, general-model training, cross-customer benchmarking, unrelated product development or new external sharing cannot be authorised merely by changing a privacy page. Before starting, Lumino must explain the new purpose, scope, recipients, duration and impact and obtain a contract amendment or separate authorisation where required."></p></article>
