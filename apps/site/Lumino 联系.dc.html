<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>联系我们 · Lumino</title>
  <meta name="description" content="说明行业、产品与时间要求，提交咨询需求。">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/apps/site/site/site-v3.css">
  <script defer src="/apps/site/site/i18n.js"></script>
  <script defer src="/apps/site/site/site-shell.js"></script>
  <script defer src="/apps/site/site/contact.js"></script>
  <script defer src="/apps/site/site/float-tools.js"></script>
</head>
<body>
<lumino-header current="contact"></lumino-header>
<main id="main">
  <section class="m-page-hero m-page-hero--compact">
    <div class="wrap">
      <p class="crumb"><a href="Lumino%20官网.dc.html" data-i18n-zh="首页" data-i18n-en="Home"></a> / <span data-i18n-zh="联系我们" data-i18n-en="Contact"></span></p>
      <h1 data-i18n-zh="告诉我们你的需求" data-i18n-en="Tell us what you need"></h1>
      <p data-i18n-zh="说明行业、产品和时间要求。提交后我们会与你确认适用服务与资料清单。" data-i18n-en="Share your industry, products and deadlines. We’ll confirm what applies and what to prepare."></p>
    </div>
  </section>
  <section class="m-section" style="padding-top:28px">
    <div class="wrap contact-layout">
      <aside class="contact-steps">
        <div class="contact-step"><span class="n">01</span><div><strong data-i18n-zh="提交需求" data-i18n-en="Send your request"></strong><span data-i18n-zh="说明行业、产品与时间要求。" data-i18n-en="Share your industry, products and deadlines."></span></div></div>
        <div class="contact-step"><span class="n">02</span><div><strong data-i18n-zh="确认适用服务" data-i18n-en="We confirm what applies"></strong><span data-i18n-zh="回复适用服务与建议准备的资料清单。" data-i18n-en="We reply with applicable services and a prep list."></span></div></div>
        <div class="contact-step"><span class="n">03</span><div><strong data-i18n-zh="确定方案与报价" data-i18n-en="Scope and quote"></strong><span data-i18n-zh="确认范围、周期与费用后开始项目。" data-i18n-en="We agree scope, timing and fees, then begin."></span></div></div>
        <div style="padding-top:14px;border-top:1px solid var(--line);font-size:var(--type-ui);color:var(--ink-secondary);display:grid;gap:4px">
          <span data-i18n-zh="正式对外邮箱上线前，请通过本页表单提交需求" data-i18n-en="Until the public inbox is live, please use this form"></span>
          <span data-i18n-zh="上海铄垣环保科技有限公司" data-i18n-en="Shanghai Shuoyuan Environmental Technology"></span>
        </div>
      </aside>
      <form class="contact-card m-form" id="contactForm" novalidate>
        <div class="m-form__grid">
          <label class="m-field">姓名 <span>必填</span><input name="name" autocomplete="name" required></label>
          <label class="m-field">公司 <span>必填</span><input name="company" autocomplete="organization" required></label>
          <label class="m-field">工作邮箱<input name="email" type="email" autocomplete="email" placeholder="name@company.com"></label>
          <label class="m-field">行业
            <select name="industry" id="industrySelect">
              <option value="">请选择</option>
              <option value="steel">钢铁</option>
              <option value="aluminium">铝及铝制品</option>
              <option value="textile">纺织服装</option>
              <option value="packaging">包装</option>
              <option value="chem">化工</option>
              <option value="elec">电子电器</option>
              <option value="other">其他</option>
            </select>
          </label>
        </div>
        <div class="m-field">
          <span style="color:var(--ink-secondary)">关注的服务（可多选）</span>
          <div class="svc-chip-pick" id="svcChips">
            <button type="button" data-svc="cbam">欧盟碳边境调节</button>
            <button type="button" data-svc="pcf">产品碳足迹</button>
            <button type="button" data-svc="esg">ESG 报告</button>
            <button type="button" data-svc="inventory">碳盘查</button>
            <button type="button" data-svc="assets">碳资产与绿证</button>
            <button type="button" data-svc="export">出口合规</button>
          </div>
          <input type="hidden" name="serviceId" id="serviceSelect" value="">
        </div>
        <label class="m-field">时间要求<input name="timeline" id="timelineField" placeholder="例如：本季度 / 客户要求 12 月前"></label>
        <label class="m-field">需求说明 <span>必填</span>
          <textarea name="note" required placeholder="例如：欧盟客户要求 12 月前提供热轧钢卷的排放数据"></textarea>
        </label>
        <input type="hidden" name="requestType" value="service-consultation">
        <input type="hidden" name="source" id="sourceField" value="public-contact">
        <div class="m-form__actions">
          <button class="button button--primary" type="submit">提交</button>
          <p class="m-form__hint">请勿在此提交敏感原始资料。正式资料将在签约后通过客户门户提交。</p>
        </div>
        <div class="m-form__message" id="formMessage" role="status" aria-live="polite" hidden></div>
      </form>
    </div>
  </section>
</main>
<lumino-footer></lumino-footer>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const chips = document.getElementById("svcChips");
  const hidden = document.getElementById("serviceSelect");
  const picked = new Set();
  const params = new URLSearchParams(location.search);
  if (params.get("serviceId")) picked.add(params.get("serviceId"));
  function sync() {
    chips.querySelectorAll("button").forEach((b) => b.classList.toggle("is-on", picked.has(b.dataset.svc)));
    hidden.value = [...picked].join(",") || (params.get("serviceId") || "");
  }
  chips.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (picked.has(b.dataset.svc)) picked.delete(b.dataset.svc); else picked.add(b.dataset.svc);
    sync();
  });
  sync();
});
</script>
</body>
</html>
