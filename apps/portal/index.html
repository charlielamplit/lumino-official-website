  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Lumino · 企业工作门户</title>
  <meta name="description" content="Lumino 多服务企业工作门户交互原型。">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <main class="login-screen" id="loginScreen">
    <header class="login-header">
      <a class="brand" href="/apps/site/Lumino%20官网.dc.html" aria-label="返回 Lumino 官网">
        <span>LUMINO</span><i aria-hidden="true"></i>
      </a>
      <nav aria-label="登录页导航">
        <a href="/apps/site/Lumino%20官网.dc.html">返回官网 <span aria-hidden="true">↗</span></a>
        <a class="login-header-cta" href="/calculator/">免费试算</a>
      </nav>
    </header>
    <section class="login-story" aria-labelledby="loginTitle">
      <div class="story-copy">
        <p class="eyebrow">LUMINO SERVICE WORKSPACE</p>
        <h1 id="loginTitle">用 AI 与平台化服务<br><span>重新定义合规核查业务</span></h1>
        <p>企业数据沉淀为可复用资产，各项服务在清晰边界内识别、确认、计算和交付。</p>
      </div>
      <div class="trust-note">
        <span aria-hidden="true">✓</span>
        <p><strong>正式项目区</strong><br>企业数据、证据和交付文件仅对获授权成员开放。</p>
      </div>
    </section>

    <section class="login-panel" aria-label="登录">
      <div class="login-box">
        <p class="eyebrow green">SECURE PORTAL</p>
        <h2>登录工作门户</h2>
        <p class="muted">进入统一服务、任务、资料与交付空间。</p>
        <div class="import-notice" id="importNotice" hidden></div>
        <form id="loginForm">
          <label>工作邮箱<input type="email" value="demo@huaxing-steel.cn" autocomplete="email" required></label>
          <label>密码<input type="password" value="lumino-demo" autocomplete="current-password" required></label>
          <div class="login-options"><label class="check"><input type="checkbox" checked> 保持登录</label><button class="link-button" type="button">忘记密码？</button></div>
          <button class="button button--primary button--large" type="submit">登录进入 <span aria-hidden="true">→</span></button>
        </form>
        <div class="demo-divider"><span>原型快速入口</span></div>
        <div class="demo-roles" aria-label="选择演示角色">
          <button type="button" data-demo-role="customer_owner"><b>客户</b><small>年度任务与 Agent</small></button>
          <button type="button" data-demo-role="customer_admin"><b>管理员</b><small>服务、组织与授权</small></button>
          <button type="button" data-demo-role="expert"><b>专家</b><small>判断与制备</small></button>
          <button type="button" data-demo-role="reviewer"><b>复核</b><small>独立复核与锁定</small></button>
          <button type="button" data-demo-role="ops"><b>运营</b><small>项目与 SLA</small></button>
          <button type="button" data-demo-role="sales"><b>商务</b><small>线索与客户</small></button>
        </div>
        <p class="prototype-note">这是交互原型。演示登录不会连接真实账号或提交企业数据。</p>
      </div>
    </section>
  </main>

  <div class="portal" id="portal" hidden>
    <header class="topbar">
      <button class="mobile-menu" id="mobileMenu" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
      <a class="brand" href="../Lumino%20官网.dc.html" aria-label="返回 Lumino 官网"><span>LUMINO</span><i aria-hidden="true"></i></a>
      <span class="product-name">企业工作门户</span>
      <div class="topbar-context">
        <button class="company-switch" type="button"><small id="companyContextLabel">当前企业</small><strong id="companyName">华星钢铁有限公司</strong><span>⌄</span></button>
        <div class="project-period" aria-label="当前项目期间">
          <label class="year-switch"><small>年度项目</small><select id="yearSelect"></select></label>
          <label class="quarter-switch" id="quarterSwitch"><small>季度数据包</small><select id="quarterSelect"><option value="Q1">Q1</option><option value="Q2">Q2</option><option value="Q3">Q3</option><option value="Q4">Q4</option></select></label>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="resource-button" type="button" data-drawer="resources" data-drawer-label="资源中心">资源</button>
        <button class="icon-button" type="button" aria-label="通知">●<span class="notification-dot"></span></button>
        <button class="profile-button" id="profileButton" type="button"><span id="profileInitial">周</span><span><small id="profileRole">项目协调人</small><strong id="profileName">周岚</strong></span><b>⌄</b></button>
        <button class="logout-button" id="logoutButton" type="button">退出</button>
      </div>
    </header>

    <div class="portal-layout">
      <aside class="sidebar" id="sidebar">
        <nav id="roleNav" aria-label="门户导航"></nav>
        <div class="sidebar-foot">
          <button class="settings-entry" id="settingsButton" type="button"><span aria-hidden="true">⚙</span><span><strong>企业设置</strong><small>企业、设施与长期主档</small></span></button>
          <p>原型角色</p>
          <label><span class="sr-only">切换演示角色</span><select id="roleSelect">
            <optgroup label="客户企业">
              <option value="customer_admin">企业管理员</option>
              <option value="customer_owner">项目协调人</option>
              <option value="customer_contrib">数据贡献者</option>
              <option value="customer_approver">内部审批人</option>
            </optgroup>
            <optgroup label="Lumino 服务团队">
              <option value="expert">CBAM 制备专家</option>
              <option value="reviewer">独立复核专家</option>
              <option value="ops">运营 / 客户成功</option>
              <option value="sales">商务 / 销售</option>
            </optgroup>
            <optgroup label="外部协作方">
              <option value="importer">欧盟进口商 / 申报人</option>
              <option value="verifier">第三方核查员</option>
              <option value="supplier">前体供应商</option>
            </optgroup>
            <optgroup label="平台治理">
              <option value="support">平台支持</option>
              <option value="platform_admin">平台管理员</option>
            </optgroup>
          </select></label>
          <small>正式产品中由账号权限决定</small>
        </div>
      </aside>
      <main class="workspace" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-layer" id="drawerLayer" hidden>
    <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="关闭侧栏"></button>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
      <header class="drawer-head"><div><p id="drawerEyebrow">DETAIL</p><h2 id="drawerTitle">详情</h2></div><button class="drawer-close" id="drawerClose" type="button" aria-label="关闭">×</button></header>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="./app.js?v=20261027-4" defer></script>
</body>
